# CPU debugging path; this is not the original trained RAFT/BPU model.
schema_version: 1
backend: sgbm_cpu
left_dir: /absolute/path/to/stereo_data100/left
right_dir: /absolute/path/to/stereo_data100/right
calibration: /absolute/path/to/org_binocular_camera_2533.conf
calibration_unit: mm
# false: perform undistortion/rectification before matching.
# Set true only for images already rectified with this calibration.
already_rectified: false
calibration_confirmed: false
rectification_confirmed: false
sgbm:
  num_disparities: 128
  block_size: 5
output:
  directory: /userdata/stereo_results/sgbm_run_01
  cloud_stride: 2
  viewer_max_points: 60000
  min_depth_m: 0.1
  max_depth_m: 30.0
  min_disparity_px: 0.5
  max_disparity_px: 192.0
ros:
  input_reliability: reliable
  enabled: false
  fps: 1.0
  keep_alive: true
  wait_for_subscribers: true
  wait_timeout_s: 60.0
  required_subscribers: [left, left_info, right_info]
  frame_id: stereo_left_optical_frame
  right_frame_id: stereo_right_optical_frame
