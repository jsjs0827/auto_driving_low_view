# 单张图片或图片目录直接送入算法，不需要相机节点或 ROS 图像发布者。
# 必须修改 sdk_config 和 offline_path；SDK JSON 应配置正确的 backend/模型，
# 并关闭 mapping/recharge，与下面的 mode: infer 保持一致。
/**:
  ros__parameters:
    input_mode: offline
    mode: infer
    sdk_config: /absolute/path/to/full_infer.json
    offline_path: /absolute/path/to/image_or_directory
    # 使用显式文件列表时，将 offline_path 改为 ""，再取消下一行注释。
    # offline_files: ["/absolute/path/to/first.png", "/absolute/path/to/second.jpg"]
    offline_format: nv12
    offline_resize: letterbox
    offline_fps: 2.0
    # false 时发完文件后保留节点；稍后启动的订阅者可能错过已发布的结果。
    # 下面启用逐帧落盘，SDK 自动创建结果目录；必须修改 save_root。
    offline_loop: false
    # true: wait for result and any enabled mask/input_image subscribers before sending.
    # Keep false for an unattended batch that saves results without ROS readers.
    offline_wait_for_subscribers: false
    offline_max_frames: 0
    frame_id: camera_optical_frame
    publish_input: false
    publish_mask: true
    publish_maps: false
    publish_every_n: 1
    save_every_n: 1
    save_root: /absolute/path/to/offline_results
